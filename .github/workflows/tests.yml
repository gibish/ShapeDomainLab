name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GUI system dependency
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 \
              && timeout --kill-after=30s 180s sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends libegl1; then
              exit 0
            fi
            echo "APT attempt ${attempt}/3 failed or timed out."
            if [ "${attempt}" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest
